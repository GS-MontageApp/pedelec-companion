name: Pedelec Pages
on:
  push:
    branches: [codex/ui-prototyp]
  pull_request:
    branches: [codex/ui-prototyp]
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Veröffentlichbaren Build erstellen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: TypeScript und Produktionsbuild (verbindliche Freigabe)
        run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  tests:
    name: Tests und Prüfbericht (informativ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Fach- und Speichertests
        id: domain
        continue-on-error: true
        run: |
          mkdir -p .test-artifacts
          pnpm test 2>&1 | tee .test-artifacts/domain.log
      - name: Build für Browserprüfungen
        id: testbuild
        continue-on-error: true
        run: pnpm run build
      - name: Testbrowser installieren
        id: browser
        if: steps.testbuild.outcome == 'success'
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium
      - name: Vorschau starten
        id: server
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm exec vite preview --host 0.0.0.0 --port 4173 --strictPort > /tmp/pedelec-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail http://localhost:4173/pedelec-companion/; then exit 0; fi
            sleep 1
          done
          cat /tmp/pedelec-preview.log
          exit 1
      - name: Mobile Ladebedienung
        id: charging
        if: steps.server.outcome == 'success'
        continue-on-error: true
        env:
          TEST_BASE_URL: http://localhost:4173/pedelec-companion/
          TEST_BROWSER_CHANNEL: chromium
          ALLOW_SECURE_TEST: '1'
        run: pnpm run test:browser 2>&1 | tee .test-artifacts/charging.log
      - name: Fahrtage, SOC und Daten-Navigation
        id: phase1
        if: steps.server.outcome == 'success'
        continue-on-error: true
        env:
          TEST_PWA_URL: http://localhost:4173/pedelec-companion/
          TEST_BROWSER_CHANNEL: chromium
        run: pnpm run test:phase1 2>&1 | tee .test-artifacts/phase1.log
      - name: Aktiver Fahrtag und SOC-Schnelleingabe
        id: activeRide
        if: steps.server.outcome == 'success'
        continue-on-error: true
        env:
          TEST_PWA_URL: http://localhost:4173/pedelec-companion/
          TEST_BROWSER_CHANNEL: chromium
        run: pnpm run test:active-ride 2>&1 | tee .test-artifacts/active-ride.log
      - name: Fahrtage löschen und fortsetzen
        id: rideManagement
        if: steps.server.outcome == 'success'
        continue-on-error: true
        env:
          TEST_PWA_URL: http://localhost:4173/pedelec-companion/
          TEST_BROWSER_CHANNEL: chromium
        run: pnpm run test:ride-management 2>&1 | tee .test-artifacts/ride-management.log
      - name: Offline, Sicherung und Update
        id: pwa
        if: steps.server.outcome == 'success'
        continue-on-error: true
        env:
          TEST_PWA_URL: http://localhost:4173/pedelec-companion/
          TEST_BROWSER_CHANNEL: chromium
        run: pnpm run test:pwa 2>&1 | tee .test-artifacts/pwa.log
      - name: Ergebnisse dokumentieren
        if: always()
        env:
          DOMAIN: ${{ steps.domain.outcome }}
          BUILD: ${{ steps.testbuild.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          SERVER: ${{ steps.server.outcome }}
          CHARGING: ${{ steps.charging.outcome }}
          PHASE1: ${{ steps.phase1.outcome }}
          PWA: ${{ steps.pwa.outcome }}
          ACTIVE_RIDE: ${{ steps.activeRide.outcome }}
          RIDE_MANAGEMENT: ${{ steps.rideManagement.outcome }}
        run: |
          {
            echo '## Teststand – Ergebnisse'
            echo "Commit: $GITHUB_SHA"
            echo '| Prüfung | Ergebnis |'
            echo '| --- | --- |'
            echo "| Fach- und Speichertests | $DOMAIN |"
            echo "| Browser-Testbuild | $BUILD |"
            echo "| Browserinstallation / Vorschau | $BROWSER / $SERVER |"
            echo "| Mobile Ladebedienung | $CHARGING |"
            echo "| Entwicklungsphase 1 | $PHASE1 |"
            echo "| Aktiver Fahrtag / SOC | $ACTIVE_RIDE |"
            echo "| Fahrtage löschen / fortsetzen | $RIDE_MANAGEMENT |"
            echo "| Offline / Sicherung / Update | $PWA |"
            echo 'Tests sind informativ. Nur ein erfolgreicher separater Produktionsbuild darf veröffentlicht werden.'
            echo 'F01: Inline-Bearbeitung korrigiert; Ä04/Ä05 nicht implementiert; Ä08 umgesetzt; Ä09 geplant.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DOMAIN $BUILD $BROWSER $SERVER $CHARGING $PHASE1 $PWA $ACTIVE_RIDE $RIDE_MANAGEMENT" == *failure* ]]; then
            echo '::warning::Mindestens eine Prüfung fehlgeschlagen. Testbericht beachten; Teststand kann trotzdem veröffentlicht sein.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testbericht-${{ github.sha }}
          path: .test-artifacts/
          if-no-files-found: warn
          retention-days: 14
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/ui-prototyp'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
